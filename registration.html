<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Vaniksha</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/registration.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="light-mode">
    <header class="main-header">
        <nav class="navbar">
            <div class="logo">
                <h1>Vaniksha</h1>
            </div>
            <div class="theme-toggle">
                <button id="themeToggle" aria-label="Toggle theme">
                    <span class="sun-icon">☀️</span>
                    <span class="moon-icon">🌙</span>
                </button>
            </div>
        </nav>
    </header>

    <main class="registration-container">
        <div class="registration-header">
            <h1>Join Vaniksha</h1>
            <p>Choose your registration type to get started</p>
        </div>

        <div class="registration-tabs">
            <button class="tab-button active" data-tab="individual">Individual Registration</button>
            <button class="tab-button" data-tab="community">Community Registration</button>
        </div>

        <div class="registration-forms">
            <!-- Individual Registration Form -->
            <form id="individual-form" class="registration-form active">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" required>
                    </div>

                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="age" min="18" required>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                            <option value="prefer-not-to-say">Prefer not to say</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="location">Location</label>
                        <div class="location-input">
                            <input type="text" id="location" name="location" required>
                            <button type="button" class="gps-button" id="detectLocation">
                                <span class="gps-icon">📍</span> Detect Location
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="contact">Mobile Number / Email</label>
                        <div class="contact-input">
                            <input type="text" id="contact" name="contact" required>
                            <button type="button" class="otp-button">Send OTP</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input">
                            <input type="password" id="password" name="password" required>
                            <button type="button" class="toggle-password">👁️</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="language">Language Preference</label>
                        <select id="language" name="language" required>
                            <option value="">Select Language</option>
                            <option value="english">English</option>
                            <option value="hindi">Hindi</option>
                            <option value="bengali">Bengali</option>
                            <option value="tamil">Tamil</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="wallet">Wallet Address (Optional)</label>
                        <div class="wallet-input">
                            <input type="text" id="wallet" name="wallet">
                            <span class="tooltip" data-tooltip="Connect your crypto wallet for rewards">ℹ️</span>
                        </div>
                    </div>

                    <div class="form-group switch-group">
                        <label for="voiceUI">Voice UI Support</label>
                        <label class="switch">
                            <input type="checkbox" id="voiceUI" name="voiceUI">
                            <span class="slider"></span>
                        </label>
                        <span class="tooltip" data-tooltip="Enable voice commands for easier navigation">ℹ️</span>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-button">Register</button>
                    <button type="reset" class="reset-button">Reset</button>
                </div>

                <div class="form-footer">
                    <p>Already have an account? <a href="#" class="login-link">Login</a></p>
                </div>
            </form>

            <!-- Community Registration Form -->
            <form id="community-form" class="registration-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="orgName">Organization Name</label>
                        <input type="text" id="orgName" name="orgName" required>
                    </div>

                    <div class="form-group">
                        <label for="orgType">Organization Type</label>
                        <select id="orgType" name="orgType" required>
                            <option value="">Select Type</option>
                            <option value="ngo">NGO</option>
                            <option value="gram-panchayat">Gram Panchayat</option>
                            <option value="cooperative">Cooperative</option>
                            <option value="school">School</option>
                            <option value="self-help-group">Self-help Group</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="adminName">Admin Contact Name</label>
                        <input type="text" id="adminName" name="adminName" required>
                    </div>

                    <div class="form-group">
                        <label for="adminContact">Admin Email / Phone</label>
                        <div class="contact-input">
                            <input type="text" id="adminContact" name="adminContact" required>
                            <button type="button" class="verify-button">Verify</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="operationalArea">Operational Area</label>
                        <select id="operationalArea" name="operationalArea" required>
                            <option value="">Select Region</option>
                            <option value="north">North India</option>
                            <option value="south">South India</option>
                            <option value="east">East India</option>
                            <option value="west">West India</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="certificate">Upload Certification Document</label>
                        <div class="file-upload">
                            <input type="file" id="certificate" name="certificate" accept=".pdf,.jpg,.png" required>
                            <label for="certificate" class="upload-label">Choose File</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Community Members</label>
                        <div class="member-inputs">
                            <div class="member-input">
                                <input type="text" placeholder="Email/Phone" required>
                                <button type="button" class="remove-member">-</button>
                            </div>
                        </div>
                        <button type="button" class="add-member">Add Member</button>
                    </div>

                    <div class="form-group">
                        <label for="communityWallet">Wallet Address</label>
                        <div class="wallet-input">
                            <input type="text" id="communityWallet" name="communityWallet">
                            <span class="tooltip" data-tooltip="Connect your crypto wallet for rewards">ℹ️</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="adminPassword">Admin Password</label>
                        <div class="password-input">
                            <input type="password" id="adminPassword" name="adminPassword" required>
                            <button type="button" class="toggle-password">👁️</button>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-button">Register Community</button>
                    <button type="reset" class="reset-button">Reset</button>
                </div>

                <div class="form-footer">
                    <p>Already have an account? <a href="#" class="login-link">Login</a></p>
                </div>
            </form>
        </div>
    </main>

    <script src="js/registration.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
